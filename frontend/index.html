<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Барахолка ТПУ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Иконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Наши стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- 1. НАВИГАЦИОННАЯ ПАНЕЛЬ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="bi bi-shop"></i> Барахолка ТПУ
                <span class="badge bg-secondary fs-6 fw-normal d-none d-md-inline">Студентам и сотрудникам</span>
            </a>
            <!-- ВАЖНО: здесь изменен target на createAdModal -->
            <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#createAdModal">
                <i class="bi bi-plus-lg"></i> Подать объявление
            </button>
        </div>
    </nav>

    <!-- 2. ПАНЕЛЬ ФИЛЬТРОВ -->
    <div class="container my-4">
        <div class="row g-3 bg-white p-3 rounded shadow-sm">
            <div class="col-12 col-md-8">
                <input type="text" id="searchInput" class="form-control" placeholder="Что ищем? (конспект, микроволновка, халат...)">
            </div>
            <div class="col-12 col-md-4">
                <select id="categoryFilter" class="form-select">
                    <option value="all">Все категории</option>
                    <option value="study">Учеба и книги</option>
                    <option value="tech">Техника и гаджеты</option>
                    <option value="dorm">Для общаги и дома</option>
                    <option value="clothes">Одежда и мерч</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 3. СЕТКА КАРТОЧЕК -->
    <div class="container pb-5">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="adsGrid">
            <!-- Карточки появятся здесь -->
        </div>
    </div>

    <!-- 4. МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ОБЪЯВЛЕНИЯ (Задача #7) -->
    <div class="modal fade" id="createAdModal" tabindex="-1" aria-labelledby="createAdModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="createAdModalLabel">Новое объявление</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
            
            <!-- Контейнер для ошибок отправки (скрыт по умолчанию) -->
            <div id="formError" class="alert alert-danger d-none" role="alert">
              Ошибка отправки. Попробуйте позже.
            </div>

            <!-- Форма (novalidate отключает дефолтные браузерные тултипы) -->
            <form id="createAdForm" class="needs-validation" novalidate>
              <div class="row g-3">
                
                <div class="col-12">
                  <label for="adTitle" class="form-label">Название <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="adTitle" required minlength="3" placeholder="Например: Микроволновка">
                  <div class="invalid-feedback">Введите название (минимум 3 символа).</div>
                </div>

                <div class="col-md-6">
                  <label for="adCategory" class="form-label">Категория <span class="text-danger">*</span></label>
                  <select class="form-select" id="adCategory" required>
                    <option value="" selected disabled>Выберите категорию...</option>
                    <option value="study">Учеба и книги</option>
                    <option value="tech">Техника и гаджеты</option>
                    <option value="dorm">Для общаги и дома</option>
                    <option value="clothes">Одежда и мерч</option>
                  </select>
                  <div class="invalid-feedback">Выберите категорию.</div>
                </div>

                <div class="col-md-6">
                  <label for="adDealType" class="form-label">Тип сделки <span class="text-danger">*</span></label>
                  <select class="form-select" id="adDealType" required>
                    <option value="" selected disabled>Выберите тип...</option>
                    <option value="sale">Продажа</option>
                    <option value="free">Отдам бесплатно</option>
                    <option value="exchange">Обмен</option>
                  </select>
                  <div class="invalid-feedback">Выберите тип сделки.</div>
                </div>

                <div class="col-md-6">
                  <label for="adPrice" class="form-label">Цена (₽) <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="adPrice" required min="0" placeholder="0">
                  <div class="invalid-feedback">Укажите цену (0 или больше).</div>
                </div>

                <!-- Изменили Telegram на ВК -->
                <div class="col-md-6">
                  <label for="adVk" class="form-label">Ссылка на профиль ВК <span class="text-danger">*</span></label>
                  <input type="url" class="form-control" id="adVk" required placeholder="https://vk.com/username">
                  <div class="invalid-feedback">Укажите ссылку на ваш профиль ВК (начиная с https://).</div>
                </div>

                <div class="col-12">
                  <label for="adDescription" class="form-label">Описание <span class="text-danger">*</span></label>
                  <textarea class="form-control" id="adDescription" rows="3" required placeholder="Расскажите о состоянии товара..."></textarea>
                  <div class="invalid-feedback">Добавьте описание товара.</div>
                </div>

              </div>
            </form>
          </div>
          
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            <!-- Кнопка Опубликовать привязана к форме через form="createAdForm" -->
            <button type="submit" form="createAdForm" class="btn btn-primary">Опубликовать</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Наш JS -->
    <script src="script.js"></script>
</body>
</html>
