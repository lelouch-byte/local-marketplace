<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Витрина объявлений</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="bi bi-shop"></i> Барахолка ТПУ
                <span class="badge bg-secondary fs-6 fw-normal d-none d-md-inline">Студентам и сотрудникам</span>
            </a>
            <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#addAdModal">
                <i class="bi bi-plus-lg"></i> Подать объявление
            </button>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-3 bg-white p-3 rounded shadow-sm">
            <div class="col-12 col-md-8">
                <input type="text" id="searchInput" class="form-control" placeholder="Что ищем? (конспект, микроволновка, халат...)">
            </div>
            <div class="col-12 col-md-4">
                <select id="categoryFilter" class="form-select">
                    <option value="all">Все категории</option>
                    <option value="study">Учеба и книги</option>
                    <option value="tech">Техника и гаджеты</option>
                    <option value="dorm">Для общаги и дома</option>
                    <option value="clothes">Одежда и мерч</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="adsGrid">
            <!-- Карточки появятся здесь -->
        </div>
    </div>

    <div class="modal fade" id="addAdModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Новое объявление</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
            <form id="adForm">
                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Цена</label>
                    <input type="number" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">Отправить</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
